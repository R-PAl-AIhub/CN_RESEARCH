   <g id="text_1">
    <text style="font-weight: 700; font-size: 5.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #d55e00" x="49.59" y="7.704" transform="rotate(-0 49.59 7.704)">Senior pipeline (as released)</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 5.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0072b2" x="147.24" y="7.704" transform="rotate(-0 147.24 7.704)">Proposed FedStat-FS</text>
   </g>
   <g id="text_3">
    <text style="font-size: 4.6px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(28.889172 24.352537)">Pool ALL raw flows</text>
    <text style="font-size: 4.6px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(24.558703 28.966912)">(train + test together)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 4.6px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(118.284547 23.906912)">Flows stay on the clients</text>
    <text style="font-size: 4.6px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(125.208984 29.141928)">(rows never leave)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 4.6px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(12.906328 51.337372)">Variance / Pearson / LDA / scaler</text>
    <text style="font-size: 4.6px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(10.476953 56.132512)">fitted on pooled data BEFORE split</text>
   </g>
   <g id="text_6">
    <text style="font-size: 4.6px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(105.704984 51.072512)">De-duplicate, split, then fit ONLY on</text>
    <text style="font-size: 4.6px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(106.618156 56.132512)">training shards (additive statistics)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 4.6px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(14.224156 78.238112)">Random 80/20 split (duplicates</text>
    <text style="font-size: 4.6px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(24.884297 83.298112)">can straddle the split)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 4.6px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(111.544828 78.449066)">Exact Pearson ∩ LDA subset F,</text>
    <text style="font-size: 4.6px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(111.906 83.298112)">global scaler (m, s): 2 uploads</text>
   </g>
   <g id="text_9">
    <text style="font-size: 4.6px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(13.683656 105.849337)">Per client: NEW LinearSVC each</text>
    <text style="font-size: 4.6px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(16.859453 110.463712)">round (global model unused)</text>
   </g>
   <g id="text_10">
    <text style="font-size: 4.6px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(112.726812 105.403712)">Warm-start FedAvg / FedProx:</text>
    <text style="font-size: 4.6px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(108.001391 110.463712)">global model -&gt; local SGD -&gt; avg</text>
   </g>
   <g id="text_11">
    <text style="font-size: 4.6px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(18.667109 132.569312)">One size-weighted average</text>
    <text style="font-size: 4.6px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(25.126156 137.629312)">= one-shot averaging</text>
   </g>
   <g id="text_12">
    <text style="font-size: 4.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #111111" x="146.682" y="135.099312" transform="rotate(-0 146.682 135.099312)">T rounds; test split touched once</text>
   </g>
  </g>
 </g>
