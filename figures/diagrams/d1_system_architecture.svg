   <g id="text_1">
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(75.36375 35.4813)">Aggregation server</text>
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(52.23 40.981425)">sums client statistics -&gt; Pearson, LDA,</text>
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(57.508125 46.0413)">intersection F, global scaler (m, s)</text>
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(51.784875 51.25455)">FedAvg: theta = sum_k (n_k/n) theta_k</text>
   </g>
   <g id="text_2">
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(25.00725 96.9303)">Client 1</text>
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(16.49625 101.67855)">local flows D_k</text>
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(19.539 107.2053)">(never sent)</text>
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(14.779875 112.7703)">statistics + SGD</text>
   </g>
   <g id="text_3">
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(89.3145 96.9303)">Client k</text>
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(80.66625 101.67855)">local flows D_k</text>
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(83.709 107.2053)">(never sent)</text>
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(78.949875 112.7703)">statistics + SGD</text>
   </g>
   <g id="text_4">
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(153.300375 96.9303)">Client K</text>
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(144.83625 101.67855)">local flows D_k</text>
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(147.879 107.2053)">(never sent)</text>
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(143.119875 112.7703)">statistics + SGD</text>
   </g>
   <g id="text_5">
    <text style="font-size: 4.6px; font-family: 'DejaVu Sans'; fill: #0072b2" transform="translate(3.834 7.77893)">Phase 1 (once): up n_kc, s_kc, M_kc;</text>
    <text style="font-size: 4.6px; font-family: 'DejaVu Sans'; fill: #0072b2" transform="translate(3.834 13.300188)">down mu, then (F, m, s)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 4.6px; font-family: 'DejaVu Sans'; fill: #d55e00" transform="translate(148.248781 7.77893)">Phase 2 (T rounds):</text>
    <text style="font-size: 4.6px; font-family: 'DejaVu Sans'; fill: #d55e00" transform="translate(133.936312 13.300188)">up theta_k, down theta^t</text>
   </g>
